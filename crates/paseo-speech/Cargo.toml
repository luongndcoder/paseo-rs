[package]
name = "paseo-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speech for the Paseo daemon: dictation streams, STT/TTS providers (local sherpa-onnx, OpenAI, Soniox), VAD turn detection"

[features]
default = []
# Local provider (Nemotron/Parakeet STT, Kokoro TTS, Silero VAD) via the official
# sherpa-onnx crate. Its build script downloads prebuilt static libraries unless
# SHERPA_ONNX_LIB_DIR points at a local copy.
sherpa = ["dep:sherpa-onnx"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes = "1"
bzip2 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
jiff = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sherpa-onnx = { version = "1.13.8", optional = true }
tar = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net", "test-util"] }
