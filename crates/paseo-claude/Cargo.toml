[package]
name = "paseo-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust client for the Claude Code CLI (stream-json stdio + control protocol)"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

async-trait.workspace = true
futures-core = "0.3"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = "0.7"
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
