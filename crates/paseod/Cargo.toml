[package]
name = "paseod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paseo Rust edge: owns the public port and fronts the TS daemon (P2)"

[lib]
name = "paseod"
path = "src/lib.rs"

[[bin]]
name = "paseod"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
bytes = "1"
crypto_box = { version = "0.9", features = ["salsa20"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
paseo-authz = { path = "../paseo-authz" }
paseo-core = { path = "../paseo-core" }
paseo-directory = { path = "../paseo-directory" }
paseo-mcp = { path = "../paseo-mcp" }
paseo-store = { path = "../paseo-store" }
paseo-tools = { path = "../paseo-tools" }
rand = "0.8"
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
x25519-dalek = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "hostname", "process"] }

[dev-dependencies]
paseo-core = { path = "../paseo-core", features = ["testing"] }
paseo-provider-api = { path = "../paseo-provider-api" }
serde_json.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
