[package]
name = "paseo-provider-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust client for the Paseo TS provider-host (JSONL-RPC over stdio): AgentClient/AgentSession as typed calls and event streams"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }
tracing.workspace = true
paseo-agent-types = { path = "../paseo-agent-types" }
paseo-provider-api = { path = "../paseo-provider-api" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
