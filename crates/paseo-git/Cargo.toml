[package]
name = "paseo-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Checkout/git domain logic for the Paseo daemon (strangler port of the TS checkout-* modules)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros", "sync", "fs"] }
regex.workspace = true
thiserror.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
