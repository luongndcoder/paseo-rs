[package]
name = "paseo-pi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust client for the Pi and Oh My Pi (OMP) local RPC processes (JSONL over stdio)"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
