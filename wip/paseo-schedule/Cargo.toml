[package]
name = "paseo-schedule"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Scheduled agents for the Paseo daemon: cron cadence, JSON schedule store, run bookkeeping"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[workspace]
