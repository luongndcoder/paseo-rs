[package]
name = "paseo-files"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "File explorer, directory suggestions, file download framing and upload for the Paseo daemon"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[workspace]
