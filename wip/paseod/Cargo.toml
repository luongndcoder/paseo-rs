[package]
name = "paseod"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Paseo Rust edge: owns the public port and fronts the TS daemon (P2)"

# Standalone workspace: keeps this crate out of the parent paseo-rs workspace while it is WIP.
[workspace]

[lib]
name = "paseod"
path = "src/lib.rs"

[[bin]]
name = "paseod"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
crypto_box = { version = "0.9", features = ["salsa20"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
x25519-dalek = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "hostname", "process"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
