[workspace]

[package]
name = "paseo-git"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Checkout/git domain logic for the Paseo daemon (strangler port of the TS checkout-* modules)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync", "fs"] }
regex = "1"
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
