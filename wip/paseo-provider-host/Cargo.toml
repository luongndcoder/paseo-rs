[package]
name = "paseo-provider-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for the Paseo TS provider-host (JSONL-RPC over stdio): AgentClient/AgentSession as typed calls and event streams"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

# Standalone workspace: keeps this crate out of the parent paseo-rs workspace while it is WIP.
[workspace]
