[package]
name = "paseo-codex"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust client for the Codex CLI app-server (JSON-RPC over stdio)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
thiserror = "2"
libc = "0.2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
libc = "0.2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }

[workspace]
