[package]
name = "paseo-file-observer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Recursive file observation (notify-based) and git root observers for the Paseo daemon"

[dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[workspace]
