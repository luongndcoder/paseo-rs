[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
uuid = "1"
sha2 = "0.10"
indexmap = { version = "2", features = ["serde"] }
proptest = "1"
